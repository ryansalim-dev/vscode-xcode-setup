name: probe
on:
  push:
    branches: [bazel-support]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - run: |
          for m in rules_apple rules_swift apple_support rules_xcodeproj rules_cc sourcekit_bazel_bsp; do echo "$m: $(curl -fsS https://bcr.bazel.build/modules/$m/metadata.json | jq -c '.versions[-5:]')"; done
          curl -fsSL https://api.github.com/repos/spotify/sourcekit-bazel-bsp/releases?per_page=3 | jq -r '.[] | .tag_name, (.assets[] | "  " + .name + " " + .browser_download_url), (.body | .[0:1500])'
          curl -fsSL https://api.github.com/repos/bazelbuild/bazel/releases/latest | jq -r .tag_name
          which bazel bazelisk; bazel --version || true; brew info bazelisk | head -3; brew search sourcekit || true
          xcodebuild -version; sw_vers; uname -m
