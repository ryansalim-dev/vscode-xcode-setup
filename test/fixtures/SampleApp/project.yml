# Minimal iOS app used by the CI test for setup-vscode-xcode.sh.
name: SampleApp
options:
  bundleIdPrefix: dev.vscodexcode
  deploymentTarget:
    iOS: "17.0"
targets:
  SampleApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vscodexcode.SampleApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    scheme: {}
